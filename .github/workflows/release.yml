name: Release

on:
  push:
    tags:
      - "v*"
  # 태그 없이 Windows 빌드만 시험한다. 릴리스에는 안 올리고 실행 화면의 Artifacts 로 받는다
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # macOS·Windows 빌드가 같은 릴리스에 올리도록 먼저 만들어 둔다. 두 빌드가 각자 만들면 동시에 만들다
  # 한쪽이 실패하거나 릴리스가 둘 생긴다. 다시 돌릴 때는 이미 있는 릴리스를 그대로 쓴다
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      online: ${{ steps.online.outputs.enabled }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # 온라인 특수판은 Supabase 주소·anon 키 시크릿이 둘 다 있을 때만 빌드한다. 값은 이 잡에 넘기지 않고 있는지만 본다
      - name: Online secrets
        id: online
        env:
          HAS_URL: ${{ secrets.VITE_SUPABASE_URL != '' }}
          HAS_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY != '' }}
        run: |
          if [ "$HAS_URL" = true ] && [ "$HAS_KEY" = true ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Online edition::VITE_SUPABASE_URL·VITE_SUPABASE_ANON_KEY 시크릿이 없어 온라인 특수판은 빌드하지 않는다"
          fi

      - name: Create release
        env:
          ONLINE: ${{ steps.online.outputs.enabled }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists"
            exit 0
          fi
          cat > notes.md <<'EOF'
          ### macOS

          유니버설 앱(Apple Silicon·Intel)이다.

          1. 아래 `.dmg` 를 받아 열고 Maple Companion 을 응용 프로그램 폴더로 끌어 놓는다. `.zip` 을 받았다면 풀어서 나온 앱을 옮긴다
          2. 공증(notarization)을 받지 않은 앱이라 처음 열 때 경고가 뜬다. 앱을 우클릭 → 「열기」를 누르거나 터미널에서 아래를 한 번 실행한다

          ```bash
          xattr -dr com.apple.quarantine "/Applications/Maple Companion.app"
          ```

          ### Windows 10·11 (x64)

          1. 아래 `-setup.exe` 를 받아 실행한다. `.msi` 를 써도 된다
          2. 서명하지 않은 앱이라 「Windows의 PC 보호」 창이 뜬다. 「추가 정보」 → 「실행」을 누른다
          3. 트레이 아이콘이 작업표시줄 오른쪽 숨겨진 아이콘(^) 안에 들어가 있을 수 있다. 끌어서 작업표시줄로 꺼내 둔다

          Windows 판은 CI 에서 빌드만 했고 실제 PC 에서는 아직 확인하지 않았다.

          캐릭터·맵·소리는 실행 중에 maplestory.io 에서 받아 오므로 인터넷이 필요하다.
          EOF
          if [ "$ONLINE" = true ]; then
            cat >> notes.md <<'EOF'

          ### Maple Companion Online

          친구용 온라인 특수판 · 참여 코드가 있어야 접속
          EOF
          fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "Maple Companion $GITHUB_REF_NAME" --notes-file notes.md

  macos:
    needs: release
    runs-on: macos-latest
    env:
      APP_NAME: Maple Companion
      BUNDLE_DIR: src-tauri/target/universal-apple-darwin/release/bundle
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: pnpm install --frozen-lockfile

      # 버섯집 앱 아이콘. 넥슨 그림이라 저장소에 넣지 않고 빌드할 때만 번들 아이콘으로 쓴다(scripts/release-icon.ts).
      # 그림이 없어도 기본 아이콘으로 빌드를 이어 간다. 그 빌드는 MAPLE_BUNDLED_ICON 이 없어 앱이 실행 중에 붙인다(app_icon.rs)
      - name: Release icon
        id: icon
        shell: bash
        # 버섯집 PNG 의 base64. 저장소에 그림을 두지 않으려고 시크릿으로 넘긴다. 등록하지 않았으면 빈 문자열이다
        env:
          RELEASE_ICON_PNG_BASE64: ${{ secrets.RELEASE_ICON_PNG_BASE64 }}
        run: |
          # 설정 파일은 아이콘을 다 만든 뒤 마지막에 쓴다. 없으면 --config 를 넘기지 않는다
          if node --experimental-strip-types scripts/release-icon.ts && [ -f src-tauri/icons-release/release-icon.conf.json ]; then
            echo "MAPLE_BUNDLED_ICON=1" >> "$GITHUB_ENV"
            echo "args=--config src-tauri/icons-release/release-icon.conf.json" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=Release icon::버섯집 아이콘을 만들지 못해 기본 아이콘으로 빌드한다"
          fi

      # 릴리스는 release 잡이 만들어 둔 것에 올린다.
      # 업데이트 파일(.app.tar.gz)을 서명키로 서명하고 latest.json(includeUpdaterJson 기본값)을 올린다
      - name: Build and upload to release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseDraft: false
          prerelease: false
          args: --target universal-apple-darwin ${{ steps.icon.outputs.args }}

      - name: Upload zipped .app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ZIP="Maple.Companion_${GITHUB_REF_NAME#v}_universal.app.zip"
          ditto -c -k --keepParent "$BUNDLE_DIR/macos/$APP_NAME.app" "$ZIP"
          gh release upload "$GITHUB_REF_NAME" "$ZIP" --clobber

  windows:
    # latest.json 은 이미 올라간 것을 받아 자기 플랫폼을 더해 다시 올린다. macOS 와 동시에 끝나면 한쪽 플랫폼이
    # 빠지므로 macOS 뒤에 돈다. macOS 가 실패해도 아래 조건으로 돈다
    needs: [release, macos]
    # 수동 실행에서는 release 잡이 건너뛰어져도 돈다
    if: ${{ !cancelled() && needs.release.result != 'failure' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: pnpm install --frozen-lockfile

      # 버섯집 앱 아이콘. 넥슨 그림이라 저장소에 넣지 않고 빌드할 때만 번들 아이콘으로 쓴다(scripts/release-icon.ts).
      # 그림이 없어도 기본 아이콘으로 빌드를 이어 간다. 그 빌드는 MAPLE_BUNDLED_ICON 이 없어 앱이 실행 중에 붙인다(app_icon.rs)
      - name: Release icon
        id: icon
        shell: bash
        # 버섯집 PNG 의 base64. 저장소에 그림을 두지 않으려고 시크릿으로 넘긴다. 등록하지 않았으면 빈 문자열이다
        env:
          RELEASE_ICON_PNG_BASE64: ${{ secrets.RELEASE_ICON_PNG_BASE64 }}
        run: |
          # 설정 파일은 아이콘을 다 만든 뒤 마지막에 쓴다. 없으면 --config 를 넘기지 않는다
          if node --experimental-strip-types scripts/release-icon.ts && [ -f src-tauri/icons-release/release-icon.conf.json ]; then
            echo "MAPLE_BUNDLED_ICON=1" >> "$GITHUB_ENV"
            echo "args=--config src-tauri/icons-release/release-icon.conf.json" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=Release icon::버섯집 아이콘을 만들지 못해 기본 아이콘으로 빌드한다"
          fi

      # bundle.targets 가 all 이라 NSIS(-setup.exe)와 MSI 를 둘 다 만든다. 서명은 하지 않는다.
      # tagName 이 비면(수동 실행) 빌드만 하고 릴리스에는 올리지 않는다
      - name: Build (and upload to release on tag)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.event_name == 'push' && github.ref_name || '' }}
          releaseDraft: false
          prerelease: false
          # 릴리스 안내가 -setup.exe(NSIS)를 먼저 권한다. NSIS 로 깐 앱을 MSI 로 업데이트하지 않게 한다
          updaterJsonPreferNsis: true
          args: ${{ steps.icon.outputs.args }}

      - name: Upload installers as workflow artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: maple-companion-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  # 친구용 온라인 특수판. 이름(Maple Companion Online)이 달라 자산 이름이 보통 판과 겹치지 않는다.
  # 업데이트 목록은 latest.json 에 섞지 않고 online-manifest 잡이 latest-online.json 으로 따로 올린다
  online-macos:
    needs: release
    if: needs.release.outputs.online == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: pnpm install --frozen-lockfile

      # 버섯집 앱 아이콘. 넥슨 그림이라 저장소에 넣지 않고 빌드할 때만 번들 아이콘으로 쓴다(scripts/release-icon.ts).
      # 그림이 없어도 기본 아이콘으로 빌드를 이어 간다. 그 빌드는 MAPLE_BUNDLED_ICON 이 없어 앱이 실행 중에 붙인다(app_icon.rs)
      - name: Release icon
        shell: bash
        env:
          RELEASE_ICON_PNG_BASE64: ${{ secrets.RELEASE_ICON_PNG_BASE64 }}
        run: |
          if node --experimental-strip-types scripts/release-icon.ts && [ -f src-tauri/icons-release/release-icon.conf.json ]; then
            echo "MAPLE_BUNDLED_ICON=1" >> "$GITHUB_ENV"
          else
            echo "::warning title=Release icon::버섯집 아이콘을 만들지 못해 기본 아이콘으로 빌드한다"
          fi

      # tauri.online.conf.json 에 CI 에서만 쓸 값을 얹어 설정 하나로 넘긴다. 업데이트 파일을 만들고, 버섯집 아이콘이 있으면
      # 번들 아이콘으로 쓴다. 트레이 그림이 없으면 번들 리소스를 빼야 빌드가 멈추지 않는다(앱은 단풍잎을 받아 쓴다)
      - name: Online config
        shell: bash
        run: |
          node -e '
          const fs = require("node:fs");
          const read = (path) => JSON.parse(fs.readFileSync(path, "utf8"));
          const config = read("src-tauri/tauri.online.conf.json");
          config.bundle.createUpdaterArtifacts = true;
          if (!fs.existsSync("src-tauri/icons-release/tray-icon.png")) {
            delete config.bundle.resources;
            console.log("::warning title=Online tray icon::트레이 그림이 없어 번들 트레이 아이콘 없이 빌드한다");
          }
          if (fs.existsSync("src-tauri/icons-release/release-icon.conf.json")) {
            config.bundle.icon = read("src-tauri/icons-release/release-icon.conf.json").bundle.icon;
          }
          fs.writeFileSync("src-tauri/tauri.online.ci.conf.json", JSON.stringify(config, null, 2));
          '

      # Supabase 주소·anon 키는 이 단계에만 넘긴다. Vite 가 빌드할 때 앱 번들에 넣는다
      - name: Build and upload to release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: false
          args: --target universal-apple-darwin --config src-tauri/tauri.online.ci.conf.json

  online-windows:
    needs: release
    if: needs.release.outputs.online == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: pnpm install --frozen-lockfile

      # 버섯집 앱 아이콘. 넥슨 그림이라 저장소에 넣지 않고 빌드할 때만 번들 아이콘으로 쓴다(scripts/release-icon.ts).
      # 그림이 없어도 기본 아이콘으로 빌드를 이어 간다. 그 빌드는 MAPLE_BUNDLED_ICON 이 없어 앱이 실행 중에 붙인다(app_icon.rs)
      - name: Release icon
        shell: bash
        env:
          RELEASE_ICON_PNG_BASE64: ${{ secrets.RELEASE_ICON_PNG_BASE64 }}
        run: |
          if node --experimental-strip-types scripts/release-icon.ts && [ -f src-tauri/icons-release/release-icon.conf.json ]; then
            echo "MAPLE_BUNDLED_ICON=1" >> "$GITHUB_ENV"
          else
            echo "::warning title=Release icon::버섯집 아이콘을 만들지 못해 기본 아이콘으로 빌드한다"
          fi

      # tauri.online.conf.json 에 CI 에서만 쓸 값을 얹어 설정 하나로 넘긴다. 업데이트 파일을 만들고, 버섯집 아이콘이 있으면
      # 번들 아이콘으로 쓴다. 트레이 그림이 없으면 번들 리소스를 빼야 빌드가 멈추지 않는다(앱은 단풍잎을 받아 쓴다)
      - name: Online config
        shell: bash
        run: |
          node -e '
          const fs = require("node:fs");
          const read = (path) => JSON.parse(fs.readFileSync(path, "utf8"));
          const config = read("src-tauri/tauri.online.conf.json");
          config.bundle.createUpdaterArtifacts = true;
          if (!fs.existsSync("src-tauri/icons-release/tray-icon.png")) {
            delete config.bundle.resources;
            console.log("::warning title=Online tray icon::트레이 그림이 없어 번들 트레이 아이콘 없이 빌드한다");
          }
          if (fs.existsSync("src-tauri/icons-release/release-icon.conf.json")) {
            config.bundle.icon = read("src-tauri/icons-release/release-icon.conf.json").bundle.icon;
          }
          fs.writeFileSync("src-tauri/tauri.online.ci.conf.json", JSON.stringify(config, null, 2));
          '

      # Supabase 주소·anon 키는 이 단계에만 넘긴다. Vite 가 빌드할 때 앱 번들에 넣는다
      - name: Build and upload to release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: false
          args: --config src-tauri/tauri.online.ci.conf.json

  # 온라인 판 업데이트 목록. 두 빌드가 올린 .sig 를 받아 한 번에 만들어서, latest.json 처럼 잡이 서로 덮을 일이 없다.
  # 한쪽 빌드가 실패해도 성공한 플랫폼만으로 올린다
  online-manifest:
    needs: [release, online-macos, online-windows]
    if: ${{ !cancelled() && needs.release.outputs.online == 'true' && (needs.online-macos.result == 'success' || needs.online-windows.result == 'success') }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      # tauri-action 이 productName 의 공백을 점으로 바꿔 올린다
      ASSET_PREFIX: Maple.Companion.Online_
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Upload latest-online.json
        run: |
          mkdir sigs
          gh release download "$GITHUB_REF_NAME" -p "${ASSET_PREFIX}*.sig" -D sigs
          node --experimental-strip-types scripts/updater-manifest.ts sigs latest-online.json "$ASSET_PREFIX"
          gh release upload "$GITHUB_REF_NAME" latest-online.json --clobber
