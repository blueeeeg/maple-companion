[package]
name = "maple-companion"
version = "0.1.7"
description = "메이플스토리 팬메이드 데스크톱 컴패니언"
authors = ["blueeeeg"]
edition = "2024"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "maple_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "image-png"] }
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
# tauri 가 이미 쓰는 그 크레이트다(image-png). 앱 아이콘 캔버스와 PNG 인코딩에 쓴다
image = { version = "0.25", default-features = false, features = ["png"] }

# 앱 아이콘을 바꾸는 AppKit 호출. tauri(tao·muda)가 이미 쓰는 버전이다
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSString"] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "NSApplication",
  "NSResponder",
  "NSImage",
  "NSWorkspace",
] }
# 알림 오른쪽 그림을 넣으려고 알림을 직접 보낸다. tauri-plugin-notification(notify-rust)이 이미 쓰는 그 크레이트다
mac-notification-sys = "0.6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_SystemInformation",
] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
